agent_guidance:
  ordering: >-
    check_availability must run before reserve_booking — the availabilityId it
    returns is the only valid input to a reservation.
  no_idempotency: >-
    The API defines no idempotency key. A failed reserve_booking must not be
    blindly retried; re-run check_availability first, and list_bookings to
    confirm whether a reservation already landed.
  human_in_the_loop: >-
    reserve_booking, confirm_booking and cancel_booking move real money and real
    inventory. Gate them behind explicit user confirmation.
