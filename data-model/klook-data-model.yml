booking_lifecycle:
  states:
  - ON_HOLD
  transitions:
  - from: (none)
    to: ON_HOLD
    via: POST /bookings (Booking Reservation)
  - from: ON_HOLD
    to: confirmed
    via: POST /bookings/{uuid}/confirm
  - from: ON_HOLD
    to: ON_HOLD (extended)
    via: POST /bookings/{uuid}/extend
  - from: confirmed
    to: cancelled
    via: POST /bookings/{uuid}/cancel (only when booking.cancellable is TRUE and within the cancellation cut-off window)
  - from: ON_HOLD
    to: expired
    via: reservation hold elapses without confirmation
  state_note: >-
    ON_HOLD is the only status value named in the documentation; the full
    BookingStatus enumeration is not published in the resolved spec.
pricing_model:
  amounts: minor units (integers)
