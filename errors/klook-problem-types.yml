format: custom
format_note: >-
  NOT rfc9457. The spec declares no application/problem+json media type; all
  error responses are application/json carrying the OCTO {error, errorMessage}
  envelope documented in errors/klook-error-codes.yml.
description: >-
  Error responses derived from the 4xx/5xx responses declared in Klook's
  published OpenAPI. The spec declares only a single 400 response per operation
  and nine of twelve operations declare it; the three read-only core endpoints
  (GET /supplier, GET /products, GET /products/{id}) declare no error response
  at all, which is a spec gap rather than an absence of errors.
