description: >-
  Klook publishes NO first-party client libraries for its Open API. This is
  consistent with the integration model: the supplier implements the OCTO
  endpoints and Klook is the calling client, so there is no Klook-side SDK for a
  partner to install. Partners implement the OCTO server contract themselves,
  typically inside an existing reservation system or channel manager. The
  packages below were found on public registries and are all third-party.
