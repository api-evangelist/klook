aid: klook
name: Klook
description: >-
  Klook is a Hong Kong-headquartered travel and experiences booking platform for
  the "things to do" sector — attractions, tours and activities, theme parks,
  food and beverage, WiFi and SIM cards, and transportation passes. Klook
  publishes an Open API specification for merchants, suppliers, reservation
  systems and channel managers who want to distribute their inventory through
  Klook's website, app and partner channels. The specification is an
  implementation of OCTO (Open Connectivity for Tours, Activities and
  Attractions), the open standard for the in-destination experiences industry:
  the supplier implements the OCTO core endpoints (Supplier, Products,
  Availability, Bookings) at their own host and Klook consumes them as the
  reseller, with optional Capabilities negotiated through the Octo-Capabilities
  header. Klook additionally runs an affiliate program and a merchant portal.
